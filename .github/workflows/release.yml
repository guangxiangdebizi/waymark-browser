# Publishes the `waymark-browser` CLI to PyPI with Trusted Publishing (OIDC): no API token is
# stored anywhere. PyPI trusts this workflow for project waymark-browser, environment `pypi`.
# Push a tag like v0.2.0 (it must equal cli/src/waymark_browser/__init__.py __version__).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('cli/src/waymark_browser/__init__.py').read_text()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package v$version"; exit 1; }
      - run: pip install build twine
      - run: python -m build cli --outdir dist
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/waymark --version
          /tmp/v/bin/python -m unittest discover -s cli/tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "Waymark $GITHUB_REF_NAME" --notes "$notes"
