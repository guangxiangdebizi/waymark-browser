name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: End-to-end against the real Electron app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          export WAYMARK_ELECTRON_ARGS="--no-sandbox --disable-gpu"
          xvfb-run -a node dist/app/launcher.js > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9510/health && break; sleep 1; done
          npm run test:electron
      - if: failure() && runner.os == 'Linux'
        run: cat app.log || true

  cli:
    name: CLI (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./cli
      - run: python -m unittest discover -s cli/tests -v
      - run: waymark --version && waymark --help > /dev/null
