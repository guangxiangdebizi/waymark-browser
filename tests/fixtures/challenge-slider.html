<!doctype html><html><head><meta charset="utf-8"><title>Slider fixture</title>
<style>body{font-family:sans-serif}.captcha-widget{width:300px;margin:40px}.slider-track{position:relative;height:40px;background:#eef;margin-top:8px}.slider-handle{position:absolute;left:0;top:0;width:40px;height:40px;background:#58f;cursor:grab}</style></head><body>
<!-- The gap and the piece are drawn only while the handle is held, so a screenshot of the idle widget shows neither. -->
<div class="captcha-widget" id="widget"><canvas id="bg" width="300" height="160"></canvas>
<div class="slider-track"><div class="slider-handle" id="handle"></div></div><p id="hint">向右拖动滑块完成拼图</p></div>
<div id="state"></div>
<script>
const params = new URLSearchParams(location.search);
const canvas = document.getElementById('bg'), ctx = canvas.getContext('2d'), handle = document.getElementById('handle');
const gx = Number(params.get('gap') || 120 + Math.floor(Math.random() * 120)), gy = 52, S = 44;
const picture = document.createElement('canvas'); picture.width = 300; picture.height = 160;
const p = picture.getContext('2d');
for (let x = 0; x < 300; x += 10) for (let y = 0; y < 160; y += 10) { p.fillStyle = `hsl(${(x * 7 + y * 3) % 360},55%,${40 + (x * y) % 30}%)`; p.fillRect(x, y, 10, 10); }
const shape = (c, x, y) => { c.beginPath(); c.rect(x, y, S, S); c.moveTo(x + S + 9, y + S / 2); c.arc(x + S, y + S / 2, 9, 0, Math.PI * 2); };
let pressed = false, startX = 0, dx = 0, moves = 0, downAt = 0;
window.trace = { attempts: 0 };
function draw() {
  ctx.drawImage(picture, 0, 0);
  if (!pressed) return;
  ctx.save(); shape(ctx, gx, gy); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fill(); ctx.restore();
  ctx.save(); shape(ctx, 4 + dx, gy); ctx.clip(); ctx.drawImage(picture, gx - 4 - dx, 0); ctx.restore();
  ctx.save(); shape(ctx, 4 + dx, gy); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
}
handle.addEventListener('mousedown', e => { pressed = true; startX = e.clientX; moves = 0; downAt = performance.now(); draw(); });
addEventListener('mousemove', e => { if (!pressed) return; moves++; dx = Math.max(0, Math.min(256, e.clientX - startX)); handle.style.left = dx + 'px'; draw(); });
addEventListener('mouseup', () => {
  if (!pressed) return;
  pressed = false; trace.attempts++;
  Object.assign(trace, { moves, heldMs: Math.round(performance.now() - downAt), offBy: Math.round(4 + dx - gx) });
  if (Math.abs(4 + dx - gx) <= 5) { document.getElementById('widget').remove(); document.getElementById('state').textContent = 'Verified slider'; }
  else { dx = 0; handle.style.left = '0px'; draw(); document.getElementById('state').textContent = 'wrong ' + trace.offBy; }
});
draw();
</script></body></html>
